<!DOCTYPE html>
<html>
<head>
    <title>Activity Logs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #99bbfc;
        }

        h1 {
            text-align: center;
        }

        #logContainer {
            border: 2px solid #0c0000;
            padding: 10px;
        }

        .logEntry {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .logEntry span {
            font-size: 12px;
            color: #080000;
            margin-right: 10px;
            min-width: 120px;
        }

        .logEntry input[type="text"] {
            flex: 1;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #d1e6fc;
        }

        .logEntry button {
            margin-left: 10px;
            cursor: pointer;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            color: #fff;
            background-color: #d3e6fa;
        }

        .logEntry button:hover {
            background-color: #0056b3;
        }

        #activityInput {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Activity Logs</h1>
    <div id="logContainer"></div>
    <input type="text" id="activityInput" placeholder="Enter activity">
    <button onclick="addActivity()">Add Activity</button>

    <script src="activity.js"></script>
</body>
</html>
