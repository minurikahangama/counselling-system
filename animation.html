<!DOCTYPE html>
<html>
    <head>
        <title>CSS animation</title>
        <link rel="stylesheet" href="style.css">
        <style>
            body{
    justify-content: center;
    align-items: center;
    display: flex;
    height: 100vh;
    background: lightcyan;
}
.loader{
    width: 300px;
    height: 300px;
    margin: 0 auto;
    position: relative;
}
.loader .loader-inner-1{
    width: 300px;
    height: 300px;
    border-radius: 50%;
    border-bottom: 10px dashed #cffc07;
    position: absolute;
    animation: loading-1 5s infinite linear;
}
.loader .loader-inner-2{
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border-bottom: 10px dotted #248ef1;
    position: absolute;
    top: 50px;
    left: 45px;
    animation: loading-1 1s infinite linear;
}
.loader .loader-inner-3{
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border-bottom: 5px solid #e9334b;
    position: absolute;
    top: 100px;
    left: 90px;
    animation: loading-1 2s infinite linear;
}
@keyframes loading-1{
    from{ -webkit-transform: rotate(0deg); }
    to{ -webkit-transform: rotate(360deg); }
}
        </style>
    </head>
    <body>
         
            <div class="loader">
                <div class="loader-inner-1"></div>
                <div class="loader-inner-2"></div>
                <div class="loader-inner-3"></div>
            </div>
         
    </body>
</html>
